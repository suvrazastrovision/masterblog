<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>

    <p class="navigation"><a href="{{ url_for('add') }}">Add a new post</a></p>

    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>{{ post.content }}</p>
            <a class="like-button" href="{{ url_for('like', post_id=post.id) }}">Like ({{ post.get('likes', 0) }})</a>
            <a class="update-button" href="{{ url_for('update', post_id=post.id) }}">Update</a>
            <a class="delete-button" href="{{ url_for('delete', post_id=post.id) }}">Delete</a>
        </div>
    {% else %}
        <p class="empty-message">No blog posts available.</p>
    {% endfor %}
</body>
</html>
